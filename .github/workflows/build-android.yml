name: Build APK from Google Drive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Instalar ferramentas
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip default-jdk
        
    - name: Baixar projeto do Google Drive
      run: |
        wget "https://drive.google.com/uc?export=download&id=1-A6guy9WSZ5YaPn4aDm0XtLMuMQsF_bT" -O projeto.zip
        
    - name: Extrair projeto
      run: |
        unzip projeto.zip
        ls -la
        
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build APK direto
      run: |
        cd pdv-parada-do-lanche02
        chmod +x gradlew
        ./gradlew assembleDebug --offline || ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: pdv-parada-do-lanche02/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 5
        
