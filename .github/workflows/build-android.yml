name: Build APK from Google Drive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Instalar ferramentas
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip default-jdk
        
    - name: Baixar projeto do Google Drive
      run: |
        wget "https://drive.google.com/uc?export=download&id=1-A6guy9WSZ5YaPn4aDm0XtLMuMQsF_bT" -O projeto.zip
        
    - name: Extrair projeto e encontrar pasta
      run: |
        unzip projeto.zip
        echo "=== Pastas encontradas ==="
        ls -la
        echo "=== Procurando pasta do projeto ==="
        for dir in */; do
          if [ -f "$dir/build.gradle" ] || [ -f "$dir/app/build.gradle" ]; then
            echo "Pasta encontrada: $dir"
            echo "PROJECT_DIR=${dir%/}" >> $GITHUB_ENV
            break
          fi
        done
        
    - name: Gerar novo Gradle Wrapper
      run: |
        cd ${{ env.PROJECT_DIR }}
        echo "=== Removendo wrapper corrompido ==="
        rm -rf gradle/wrapper/gradle-wrapper.jar
        rm -f gradlew gradlew.bat
        echo "=== Gerando novo wrapper ==="
        gradle wrapper --gradle-version 7.6
        echo "=== Verificando novo wrapper ==="
        ls -la gradle/wrapper/
        ls -la gradlew
        
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 5
